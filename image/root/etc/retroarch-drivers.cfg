# Driver baseline for RetroArch on this container's Selkies/Xvfb desktop.
# Appended over /config/.config/retroarch/retroarch.cfg by every launcher, so
# the values below survive both a fresh /config and RetroArch rewriting its own
# config on exit (config_save_on_exit is left on deliberately -- per-core
# tweaks made in the GUI should still persist).
#
# video_driver MUST be sdl2. Under the "gl" (GLX) driver RetroArch renders and
# runs the core perfectly but registers NOT ONE keypress -- game buttons, the
# F1 menu and Escape all dead together. It is not a binding problem: key events
# reach RetroArch's window (confirmed with xev) and XQueryKeymap reflects keys
# held down, yet RetroArch discards them. SDL2 runs its own X event loop and
# reads the keyboard correctly. Standalone MAME was never affected because it
# is already SDL-based, which is why arcade games worked while every libretro
# core looked "broken".
video_driver = "sdl2"

# input_driver must NOT be udev. The only nodes in this container's /dev/input
# are Selkies' virtual gamepads, and they are not readable even by root, so the
# udev input driver finds no keyboard whatsoever and is silently deaf. Keyboard
# input arrives over XTEST, so it has to be read from X.
input_driver = "x"

# Joypads are the one thing udev does serve here (Selkies exposes js0-js3).
input_joypad_driver = "udev"
